[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*"]

[project]
name = "caixa-papelaria"
version = "1.5.0"
description = "Controle de caixa e fiado para papelaria (uso local, sem internet)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.*",
    "starlette==1.8.*",  # fixado: o FastAPI aceita versões antigas com falhas conhecidas
    "uvicorn==0.54.*",
    "jinja2==3.1.*",
    "python-multipart==0.0.*",
    "sqlalchemy==2.0.*",
    "alembic==1.20.*",
    "argon2-cffi==25.1.*",
    "tzdata==2026.*",  # Windows não traz o banco de fusos (America/Sao_Paulo)
    "fpdf2==2.8.*",  # PDF em Python puro (traz Pillow; não carregamos imagens externas)
    "cryptography==50.*",  # criptografia do backup (AES-256-GCM + scrypt); manter atualizado
    "segno==1.6.*",  # QR Code do endereço para o celular (Python puro)
]

[project.optional-dependencies]
nuvem = [
    "psycopg[binary]==3.3.*",  # PostgreSQL (Neon) para a publicação no Render
]
dev = [
    "pytest==8.3.*",
    "pytest-cov==6.0.*",
    "httpx==0.28.*",
    "ruff==0.8.*",
    "mypy==1.13.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "B008",   # Depends()/Form() como default é o padrão do FastAPI
    "RUF001", # caracteres em português nas strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
