{% extends "base.html" %}
{% block titulo %}Trocar senha{% endblock %}
{% block conteudo %}
<section class="cartao estreito">
  <h1>Trocar minha senha</h1>
  {% if usuario and usuario.trocar_senha %}
  <p>Você está usando uma senha provisória. Crie uma senha só sua para continuar.</p>
  {% endif %}
  <form method="post" action="/trocar-senha" class="formulario">
    <input type="hidden" name="{{ campo_csrf }}" value="{{ csrf_token }}">
    <label>Senha atual
      <input name="atual" type="password" required autofocus autocomplete="current-password">
    </label>
    <label>Nova senha
      <input name="nova" type="password" required autocomplete="new-password">
    </label>
    <label>Repita a nova senha
      <input name="confirmacao" type="password" required autocomplete="new-password">
    </label>
    <button type="submit" class="botao botao-principal">Salvar nova senha</button>
  </form>
</section>
{% endblock %}
